[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "shanghai"            # BSC is on shanghai, not cancun
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
# `usdt`/`dswp`/`router` are intentional lowercase public getters — the prevailing DeFi
# convention (Uniswap/PancakeSwap use token0/factory lowercase) and they match the already
# deployed + BSCScan-verified ABI. Suppress only this stylistic note; all other lints stay on.
exclude_lints = ["screaming-snake-case-immutable"]

[profile.default.fuzz]
runs = 1000                          # default fast loop; CI/gate uses 10000

[profile.ci.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
